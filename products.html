<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>
  <header class="site-header">
    <h1 class="logo"><a href="index.html">ShopNow</a></h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-nav-slot" class="auth-slot"></span>
    </nav>
  </header>

  <section class="hero">
    <h2>Everyday tech, honest prices.</h2>
  </section>

  <section class="controls">
    <input type="text" id="search-box" placeholder="Search products...">

    <select id="sort-select">
      <option value="default">Sort by Price</option>
      <option value="low-high">Price: Low to High</option>
      <option value="high-low">Price: High to Low</option>
    </select>

    <div id="category-filters" class="category-filters"></div>
  </section>

  <!-- LAB 9: Smart Product Search -->
  <section class="smart-search">
    <h3>Smart Search</h3>
    <input type="text" id="smart-search" placeholder='Try: "accessories under 200" or "samsung phone"'>
    <div id="smart-results"></div>
  </section>

  <div id="product-list" class="product-grid"></div>

<footer class="site-footer"><p>&copy; 2026 ShopNow. All rights reserved.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=4"></script> 

</body>
</html>
