
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — ShopNow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">ShopNow</h1>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main style="padding: 2rem; max-width: 900px; margin: auto;">

    <h1>🛍️ Checkout</h1>
    <p>Review your order and enter your shipping information.</p>

    <section style="margin-top: 2rem;">
      <h2>📦 Order Summary</h2>

      <div id="checkout-summary" style="margin-top: 1rem;"></div>

      <h3 style="margin-top: 1rem;">
        Total: AED <span id="checkout-total">0.00</span>
      </h3>
    </section>

    <section style="margin-top: 2rem;">
      <h2>🚚 Shipping Information</h2>

      <form id="checkout-form" class="form" novalidate>

        <div style="margin-top: 1rem;">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div style="margin-top: 1rem;">
          <label for="address">Delivery Address</label>
          <textarea
            id="address"
            name="address"
            rows="3"
            placeholder="Enter your delivery address"
            required
          ></textarea>
        </div>

        <div style="margin-top: 1rem;">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+971 50 123 4567"
            required
          >
        </div>

        <button
          type="submit"
          id="place-order-btn"
          style="margin-top: 1.5rem; padding: 12px 24px; cursor: pointer;">
          Place Order
        </button>

      </form>
    </section>

    <p style="margin-top: 2rem;">
      <a href="cart.html">← Back to Cart</a>
    </p>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ShopNow.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>

  <script>
    // Display the items currently stored in the cart.
    const summary = document.getElementById("checkout-summary");
    const cart = getCart();

    if (cart.length === 0) {
      summary.textContent = "Your cart is empty. Please add products first.";
      document.getElementById("place-order-btn").disabled = true;
    } else {
      summary.innerHTML = cart.map(item => {
        const quantity = Number(item.quantity);
        const price = Number(item.price);

        return `
          <p style="margin-bottom: 0.75rem;">
            ${escapeHTML(item.name)}
            × ${quantity}
            — AED ${(price * quantity).toFixed(2)}
          </p>
        `;
      }).join("");
    }
  </script>

</body>
</html>
