<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopNow</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header class="site-header">
    <h1 class="logo"><a href="index.html">ShopNow</a></h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-nav-slot" class="auth-slot"></span>
    </nav>
  </header>

  <main class="auth-page">
    <form id="login-form" class="card form">
      <h2>Login</h2>
      <p class="muted">Welcome back. Log in to check out and see your orders.</p>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn">Login</button>

      <p class="muted">Don't have an account? <a href="Register.html">Register</a></p>
    </form>
  </main>

  <footer class="site-footer"><p>&copy; 2026 ShopNow. All rights reserved.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
